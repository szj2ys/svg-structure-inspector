<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" role="img" aria-labelledby="title desc"><title id="title">Three different SVG drawing elements</title><desc id="desc">A blue rectangle, a gold circle and the letter A represent rect, circle and text. None requires a path element.</desc><rect x="22" y="13" width="72" height="72" fill="#66aaff"/><circle cx="179" cy="49" r="36" fill="#ffcc66"/><text x="300" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="84" fill="#223237">A</text><g font-family="monospace" font-size="17" fill="#223237" text-anchor="middle"><text x="58" y="117">rect</text><text x="179" y="117">circle</text><text x="300" y="117">text</text></g></svg>
