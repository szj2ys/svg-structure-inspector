<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">Three use references, three different findings</title><desc id="desc">Use one points to tick, whose ID is present. Use two points to a missing ID. Use three references an external SVG, which is not loaded. No target is expanded.</desc><g fill="#edf1ee" stroke="#d8dfdc"><rect x="5" y="15" width="78" height="52" rx="3"/><rect x="5" y="103" width="78" height="52" rx="3"/><rect x="5" y="191" width="78" height="52" rx="3"/><rect x="133" y="5" width="221" height="72" rx="3"/><rect x="133" y="93" width="221" height="72" rx="3"/><rect x="133" y="181" width="221" height="72" rx="3"/></g><g stroke="#09665c" fill="none" stroke-width="2"><path d="M83 41h43m-7-5 7 5-7 5M83 129h43m-7-5 7 5-7 5M83 217h43m-7-5 7 5-7 5"/></g><g font-family="monospace" fill="#223237" font-size="16"><text x="19" y="47">use 1</text><text x="19" y="135">use 2</text><text x="19" y="223">use 3</text><text x="150" y="32">#tick</text><text x="150" y="120">#missing</text><text x="150" y="208">icons.svg#tick</text></g><g font-family="monospace" font-size="14" fill="#57676b"><text x="150" y="57">id_present</text><text x="150" y="145">missing_id</text><text x="150" y="233">not_loaded</text></g></svg>
